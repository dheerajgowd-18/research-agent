[project]
name = "verified-research-agent"
version = "0.1.0"
description = "A domain-agnostic research system with claim-level verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-groq>=0.2.0",
    "tavily-python>=0.5.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verified_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
